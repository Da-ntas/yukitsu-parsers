name: Auto Release to JitPack

on:
    workflow_run:
        workflows: ["Check & Test latest parsers"]
        types:
            - completed

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 🌏
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      -   name: Set up enviroment 🔧
          uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
          with:
              java-version: '21'
              distribution: 'temurin'

      -   name: Set up Gradle 📦
          uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      -   name: Compile parsers 🚀
          run: ./gradlew compileKotlin

      - name: Generate Version 🏷️
        id: vars
        run: |
            VERSION="1.0.${{ github.run_number }}"
            TAG="v$VERSION"

            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag 📌
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.vars.outputs.tag }}"
          git push origin "${{ steps.vars.outputs.tag }}"

      - name: Trigger Yukitsu APK release
        env:
            GH_TOKEN: ${{ secrets.YUKITSU_DISPATCH_TOKEN }}
            PARSERS_VERSION: ${{ steps.vars.outputs.version }}
        shell: bash
        run: |
            set -euo pipefail

            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.github.com/repos/Da-ntas/Kotatsu/dispatches" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --data "$(jq -n \
                --arg version "$PARSERS_VERSION" \
                '{
                  event_type: "parsers_release",
                  client_payload: { version: $version }
                }')"

name: Auto Release to JitPack

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 🌏
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 🔧
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 📦
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Test 🚀
        run: ./gradlew build

      - name: Generate Version 🏷️
        id: vars
        run: |
          # Usando 1.0 como base, incrementando com o número do build
          VERSION="1.0.${{ github.run_number }}"
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git Tag 📌
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.vars.outputs.tag }}
          git push origin ${{ steps.vars.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify JitPack ☁️
        run: |
          # Converte o repositório para o formato do JitPack (com.github.user.repo)
          REPO_PATH=$(echo "${{ github.repository }}" | sed 's/\//\./')
          # Ping para iniciar o build no JitPack
          curl -s -I "https://jitpack.io/api/builds/com.github.${{ github.repository }}/${{ steps.vars.outputs.tag }}" > /dev/null
          echo "Release ${{ steps.vars.outputs.tag }} enviada para o JitPack!"

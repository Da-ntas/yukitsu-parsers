name: Auto Release to JitPack

on:
    workflow_run:
        workflows: ["Check & Test latest parsers"]
        types:
            - completed

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 🌏
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up JDK 17 🔧
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 📦
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Test 🚀
        run: ./gradlew build

      - name: Generate Version 🏷️
        id: vars
        run: |
          # Usando 1.0 como base, incrementando com o número do build
          VERSION="1.0.${{ github.run_number }}"
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git Tag 📌
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.vars.outputs.tag }}
          git push origin ${{ steps.vars.outputs.tag }}

      - name: Trigger JitPack Build ☁️
        run: |
            VERSION="${{ steps.vars.outputs.tag }}"
            REPOSITORY="${{ github.repository }}"

            echo "Triggering JitPack build..."
            echo "Repository: $REPOSITORY"
            echo "Version: $VERSION"

            curl --fail --show-error --silent \
              -X POST \
              "https://jitpack.io/api/builds/com.github.${REPOSITORY}/${VERSION}"

            echo "JitPack build triggered successfully!"
